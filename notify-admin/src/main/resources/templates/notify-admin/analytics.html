<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NotifyHub Admin - Analytics</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0e17;
            color: #e0def4;
            min-height: 100vh;
        }
        nav {
            background: linear-gradient(135deg, #1a1730 0%, #2d2b55 100%);
            border-bottom: 1px solid #3d3a6e;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 60px;
        }
        nav .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #a78bfa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        nav .brand img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        nav .nav-links {
            display: flex;
            gap: 0.25rem;
            margin-left: 2rem;
        }
        nav .nav-links a {
            color: #c4b5fd;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active {
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #e0def4;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #8b87a8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .chart-card {
            background: linear-gradient(135deg, #1a1730 0%, #221f3d 100%);
            border: 1px solid #2d2b55;
            border-radius: 12px;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .chart-card:hover {
            border-color: #a78bfa;
        }
        .chart-card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 1rem;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 280px;
            color: #6b6889;
            font-style: italic;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
            nav { padding: 0 1rem; }
            nav .nav-links { margin-left: 1rem; gap: 0; }
            nav .nav-links a { padding: 0.5rem 0.5rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" th:href="@{/notify-admin}">
            <img th:src="@{/notify-admin/logo.png}" alt="NotifyHub"/>
            NotifyHub Admin
        </a>
        <div class="nav-links">
            <a th:href="@{/notify-admin}">Dashboard</a>
            <a th:href="@{/notify-admin/analytics}" class="active">Analytics</a>
            <a th:href="@{/notify-admin/tracking}">Tracking</a>
            <a th:href="@{/notify-admin/dlq}">DLQ</a>
            <a th:href="@{/notify-admin/channels}">Channels</a>
            <a th:href="@{/notify-admin/audit-log}">Audit Log</a>
            <a th:href="@{/notify-admin/audiences}">Audiences</a>
            <a th:href="@{/notify-admin/status-webhook}">Status Webhook</a>
        </div>
    </nav>

    <div class="container">
        <h1>Analytics</h1>
        <p class="subtitle">Notification performance and delivery insights</p>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Status Breakdown</h2>
                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Messages per Channel</h2>
                <div class="chart-wrapper">
                    <canvas id="channelChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Timeline (Last 7 Days)</h2>
                <div class="chart-wrapper">
                    <canvas id="timelineChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Top Errors</h2>
                <div class="chart-wrapper">
                    <canvas id="errorsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script>
        const STATUS_COLORS = {
            SENT: '#34d399',
            FAILED: '#f87171',
            PENDING: '#fbbf24',
            SCHEDULED: '#a78bfa',
            CANCELLED: '#8b87a8'
        };
        const CHANNEL_COLORS = ['#60a5fa','#a78bfa','#34d399','#fbbf24','#f87171','#f472b6','#38bdf8','#fb923c','#4ade80','#e879f9'];

        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#c4b5fd', font: { size: 12 } } },
                tooltip: {
                    backgroundColor: '#221f3d',
                    borderColor: '#3d3a6e',
                    borderWidth: 1,
                    titleColor: '#e0def4',
                    bodyColor: '#c4b5fd'
                }
            }
        };

        const basePath = document.querySelector('nav .brand').getAttribute('href').replace(/\/$/, '');

        // 1. Status Donut
        fetch(basePath + '/api/stats/overview')
            .then(r => r.json())
            .then(data => {
                const labels = Object.keys(data);
                const values = Object.values(data);
                if (values.every(v => v === 0) || labels.length === 0) {
                    document.getElementById('statusChart').parentElement.innerHTML = '<div class="empty-state">No data yet</div>';
                    return;
                }
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: labels.map(l => STATUS_COLORS[l] || '#8b87a8'),
                            borderColor: '#1a1730',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        cutout: '60%',
                        plugins: {
                            ...chartDefaults.plugins,
                            legend: { ...chartDefaults.plugins.legend, position: 'right' }
                        }
                    }
                });
            });

        // 2. Channel Bar (horizontal)
        fetch(basePath + '/api/stats/by-channel')
            .then(r => r.json())
            .then(data => {
                const labels = Object.keys(data);
                const values = Object.values(data);
                if (labels.length === 0) {
                    document.getElementById('channelChart').parentElement.innerHTML = '<div class="empty-state">No data yet</div>';
                    return;
                }
                new Chart(document.getElementById('channelChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Messages',
                            data: values,
                            backgroundColor: labels.map((_, i) => CHANNEL_COLORS[i % CHANNEL_COLORS.length]),
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        indexAxis: 'y',
                        scales: {
                            x: { ticks: { color: '#8b87a8' }, grid: { color: '#2d2b55' } },
                            y: { ticks: { color: '#c4b5fd' }, grid: { display: false } }
                        },
                        plugins: { ...chartDefaults.plugins, legend: { display: false } }
                    }
                });
            });

        // 3. Timeline Line
        fetch(basePath + '/api/stats/timeline?days=7')
            .then(r => r.json())
            .then(data => {
                const labels = data.map(d => d.date.substring(5)); // MM-DD
                new Chart(document.getElementById('timelineChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Sent',
                                data: data.map(d => d.sent),
                                borderColor: '#34d399',
                                backgroundColor: 'rgba(52,211,153,0.1)',
                                fill: true,
                                tension: 0.3,
                                pointRadius: 4,
                                pointBackgroundColor: '#34d399'
                            },
                            {
                                label: 'Failed',
                                data: data.map(d => d.failed),
                                borderColor: '#f87171',
                                backgroundColor: 'rgba(248,113,113,0.1)',
                                fill: true,
                                tension: 0.3,
                                pointRadius: 4,
                                pointBackgroundColor: '#f87171'
                            }
                        ]
                    },
                    options: {
                        ...chartDefaults,
                        scales: {
                            x: { ticks: { color: '#8b87a8' }, grid: { color: '#2d2b55' } },
                            y: { ticks: { color: '#8b87a8' }, grid: { color: '#2d2b55' }, beginAtZero: true }
                        }
                    }
                });
            });

        // 4. Top Errors Bar (vertical)
        fetch(basePath + '/api/stats/errors')
            .then(r => r.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById('errorsChart').parentElement.innerHTML = '<div class="empty-state">No errors recorded</div>';
                    return;
                }
                const labels = data.map(d => d.message.length > 35 ? d.message.substring(0, 35) + '...' : d.message);
                new Chart(document.getElementById('errorsChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Occurrences',
                            data: data.map(d => d.count),
                            backgroundColor: '#f87171',
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        scales: {
                            x: { ticks: { color: '#8b87a8', maxRotation: 45 }, grid: { display: false } },
                            y: { ticks: { color: '#8b87a8' }, grid: { color: '#2d2b55' }, beginAtZero: true }
                        },
                        plugins: { ...chartDefaults.plugins, legend: { display: false } }
                    }
                });
            });
    </script>
</body>
</html>
