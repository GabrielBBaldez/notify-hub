<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NotifyHub Admin - Analytics</title>
    <link rel="stylesheet" th:href="@{/notify-admin/admin.css}"/>
    <script th:src="@{/notify-admin/theme.js}"></script>
    <style>
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .chart-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-end) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .chart-card:hover { border-color: var(--accent); }
        .chart-card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 1rem;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 280px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav th:replace="~{notify-admin/fragments/layout :: nav('analytics')}"></nav>

    <div class="container">
        <h1>Analytics</h1>
        <p class="subtitle">Notification performance and delivery insights</p>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Status Breakdown</h2>
                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Messages per Channel</h2>
                <div class="chart-wrapper">
                    <canvas id="channelChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Timeline (Last 7 Days)</h2>
                <div class="chart-wrapper">
                    <canvas id="timelineChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>Top Errors</h2>
                <div class="chart-wrapper">
                    <canvas id="errorsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script>
        const STATUS_COLORS = {
            SENT: '#34d399',
            FAILED: '#f87171',
            PENDING: '#fbbf24',
            SCHEDULED: '#f97316',
            CANCELLED: '#94a3b8'
        };
        const CHANNEL_COLORS = ['#60a5fa','#f97316','#34d399','#fbbf24','#f87171','#f472b6','#38bdf8','#fb923c','#4ade80','#e879f9'];

        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#fb923c', font: { size: 12 } } },
                tooltip: {
                    backgroundColor: '#1a2233',
                    borderColor: '#334155',
                    borderWidth: 1,
                    titleColor: '#e2e8f0',
                    bodyColor: '#fb923c'
                }
            }
        };

        const basePath = document.querySelector('nav .brand').getAttribute('href').replace(/\/$/, '');

        fetch(basePath + '/api/stats/overview')
            .then(r => r.json())
            .then(data => {
                const labels = Object.keys(data);
                const values = Object.values(data);
                if (values.every(v => v === 0) || labels.length === 0) {
                    document.getElementById('statusChart').parentElement.innerHTML = '<div class="empty-state">No data yet</div>';
                    return;
                }
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: labels.map(l => STATUS_COLORS[l] || '#8b87a8'),
                            borderColor: '#111827',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        cutout: '60%',
                        plugins: {
                            ...chartDefaults.plugins,
                            legend: { ...chartDefaults.plugins.legend, position: 'right' }
                        }
                    }
                });
            });

        fetch(basePath + '/api/stats/by-channel')
            .then(r => r.json())
            .then(data => {
                const labels = Object.keys(data);
                const values = Object.values(data);
                if (labels.length === 0) {
                    document.getElementById('channelChart').parentElement.innerHTML = '<div class="empty-state">No data yet</div>';
                    return;
                }
                new Chart(document.getElementById('channelChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Messages',
                            data: values,
                            backgroundColor: labels.map((_, i) => CHANNEL_COLORS[i % CHANNEL_COLORS.length]),
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        indexAxis: 'y',
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#fb923c' }, grid: { display: false } }
                        },
                        plugins: { ...chartDefaults.plugins, legend: { display: false } }
                    }
                });
            });

        fetch(basePath + '/api/stats/timeline?days=7')
            .then(r => r.json())
            .then(data => {
                const labels = data.map(d => d.date.substring(5));
                new Chart(document.getElementById('timelineChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Sent',
                                data: data.map(d => d.sent),
                                borderColor: '#34d399',
                                backgroundColor: 'rgba(52,211,153,0.1)',
                                fill: true, tension: 0.3,
                                pointRadius: 4, pointBackgroundColor: '#34d399'
                            },
                            {
                                label: 'Failed',
                                data: data.map(d => d.failed),
                                borderColor: '#f87171',
                                backgroundColor: 'rgba(248,113,113,0.1)',
                                fill: true, tension: 0.3,
                                pointRadius: 4, pointBackgroundColor: '#f87171'
                            }
                        ]
                    },
                    options: {
                        ...chartDefaults,
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' }, beginAtZero: true }
                        }
                    }
                });
            });

        fetch(basePath + '/api/stats/errors')
            .then(r => r.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById('errorsChart').parentElement.innerHTML = '<div class="empty-state">No errors recorded</div>';
                    return;
                }
                const labels = data.map(d => d.message.length > 35 ? d.message.substring(0, 35) + '...' : d.message);
                new Chart(document.getElementById('errorsChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Occurrences',
                            data: data.map(d => d.count),
                            backgroundColor: '#f87171',
                            borderRadius: 6, borderSkipped: false
                        }]
                    },
                    options: {
                        ...chartDefaults,
                        scales: {
                            x: { ticks: { color: '#94a3b8', maxRotation: 45 }, grid: { display: false } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' }, beginAtZero: true }
                        },
                        plugins: { ...chartDefaults.plugins, legend: { display: false } }
                    }
                });
            });
    </script>
</body>
</html>
