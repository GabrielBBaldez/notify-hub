<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NotifyHub Admin - Audit Log</title>
    <link rel="stylesheet" th:href="@{/notify-admin/admin.css}"/>
    <script th:src="@{/notify-admin/theme.js}"></script>
</head>
<body>
    <nav th:replace="~{notify-admin/fragments/layout :: nav('audit-log')}"></nav>

    <div class="container">
        <h1>Audit Log <span class="count-badge" th:text="${#lists.size(entries)}">0</span></h1>
        <p class="subtitle">Complete history of all notification system events</p>

        <div th:if="${!auditEnabled}" class="table-wrapper">
            <p class="disabled-msg">Audit log is not enabled. Set <code>notify.audit.enabled=true</code> in your configuration.</p>
        </div>

        <div th:if="${auditEnabled}">
            <form th:action="@{/notify-admin/audit-log}" method="get" class="filter-bar">
                <label for="event-filter">Filter by event:</label>
                <select id="event-filter" name="event" onchange="this.form.submit()">
                    <option value="">All Events</option>
                    <option th:each="et : ${eventTypes}" th:value="${et.name()}" th:text="${et.name()}"
                            th:selected="${et.name() == selectedEvent}">event</option>
                </select>
            </form>

            <div class="table-wrapper">
                <div th:if="${#lists.isEmpty(entries)}" class="empty-msg">
                    No audit entries found.
                </div>
                <table th:unless="${#lists.isEmpty(entries)}">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Event</th>
                            <th>Channel</th>
                            <th>Recipient</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${entries}">
                            <td th:text="${#temporals.format(e.timestamp, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01</td>
                            <td>
                                <span class="badge badge-sent" th:if="${e.eventType.name() == 'NOTIFICATION_SENT'}">Sent</span>
                                <span class="badge badge-failed" th:if="${e.eventType.name() == 'NOTIFICATION_FAILED'}">Failed</span>
                                <span class="badge badge-scheduled" th:if="${e.eventType.name() == 'NOTIFICATION_SCHEDULED'}">Scheduled</span>
                                <span class="badge badge-cancelled" th:if="${e.eventType.name() == 'NOTIFICATION_CANCELLED'}">Cancelled</span>
                            </td>
                            <td th:text="${e.channelName ?: '-'}">email</td>
                            <td th:text="${e.recipient ?: '-'}">user@example.com</td>
                            <td>
                                <span class="details-text" th:if="${e.details}" th:text="${e.details}" th:title="${e.details}">details</span>
                                <span th:unless="${e.details}">-</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
