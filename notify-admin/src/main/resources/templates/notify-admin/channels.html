<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NotifyHub Admin - Channels</title>
    <link rel="stylesheet" th:href="@{/notify-admin/admin.css}"/>
    <script th:src="@{/notify-admin/theme.js}"></script>
    <style>
        .channel-name {
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <nav th:replace="~{notify-admin/fragments/layout :: nav('channels')}"></nav>

    <div class="container">
        <h1>Channels <span class="count-badge" th:text="${#lists.size(channelInfos)}">0</span></h1>
        <p class="subtitle">Status of all registered notification channels</p>

        <div class="table-wrapper">
            <div th:if="${#lists.isEmpty(channelInfos)}" class="empty-msg">
                No notification channels registered.
            </div>
            <table th:unless="${#lists.isEmpty(channelInfos)}">
                <thead>
                    <tr>
                        <th>Channel Name</th>
                        <th>Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ch : ${channelInfos}">
                        <td>
                            <span style="display:inline-flex;align-items:center;gap:0.5rem;">
                                <span class="status-dot" th:classappend="${ch.available} ? 'online' : 'offline'"></span>
                                <span class="channel-name" th:text="${ch.name}">email</span>
                            </span>
                        </td>
                        <td>
                            <span class="type-text" th:text="${ch.type}">SmtpEmailChannel</span>
                        </td>
                        <td>
                            <span class="badge badge-available" th:if="${ch.available}">Available</span>
                            <span class="badge badge-unavailable" th:unless="${ch.available}">Unavailable</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
