<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NotifyHub Admin - Channels</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f0e17;
            color: #e0def4;
            min-height: 100vh;
        }
        nav {
            background: linear-gradient(135deg, #1a1730 0%, #2d2b55 100%);
            border-bottom: 1px solid #3d3a6e;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 60px;
        }
        nav .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #a78bfa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        nav .brand svg {
            width: 24px;
            height: 24px;
            fill: #a78bfa;
        }
        nav .nav-links {
            display: flex;
            gap: 0.25rem;
            margin-left: 2rem;
        }
        nav .nav-links a {
            color: #c4b5fd;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active {
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #e0def4;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #8b87a8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .count-badge {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .table-wrapper {
            background: linear-gradient(135deg, #1a1730 0%, #221f3d 100%);
            border: 1px solid #2d2b55;
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            text-align: left;
            padding: 0.85rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b87a8;
            border-bottom: 1px solid #2d2b55;
            font-weight: 600;
        }
        tbody td {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(45, 43, 85, 0.5);
            color: #c4b5fd;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background: rgba(167, 139, 250, 0.05);
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-available { background: rgba(52, 211, 153, 0.15); color: #34d399; }
        .badge-unavailable { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .channel-name {
            font-weight: 600;
            color: #e0def4;
        }
        .type-text {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.8rem;
            color: #8b87a8;
        }
        .empty-msg {
            color: #6b6889;
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            nav { padding: 0 1rem; }
            nav .nav-links { margin-left: 1rem; gap: 0; }
            nav .nav-links a { padding: 0.5rem 0.5rem; font-size: 0.8rem; }
            .table-wrapper { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" th:href="@{/notify-admin}">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            NotifyHub Admin
        </a>
        <div class="nav-links">
            <a th:href="@{/notify-admin}">Dashboard</a>
            <a th:href="@{/notify-admin/tracking}">Tracking</a>
            <a th:href="@{/notify-admin/dlq}">DLQ</a>
            <a th:href="@{/notify-admin/channels}" class="active">Channels</a>
        </div>
    </nav>

    <div class="container">
        <h1>Channels <span class="count-badge" th:text="${#lists.size(channelInfos)}">0</span></h1>
        <p class="subtitle">Status of all registered notification channels</p>

        <div class="table-wrapper">
            <div th:if="${#lists.isEmpty(channelInfos)}" class="empty-msg">
                No notification channels registered.
            </div>
            <table th:unless="${#lists.isEmpty(channelInfos)}">
                <thead>
                    <tr>
                        <th>Channel Name</th>
                        <th>Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ch : ${channelInfos}">
                        <td>
                            <span class="channel-name" th:text="${ch.name}">email</span>
                        </td>
                        <td>
                            <span class="type-text" th:text="${ch.type}">SmtpEmailChannel</span>
                        </td>
                        <td>
                            <span class="badge badge-available" th:if="${ch.available}">Available</span>
                            <span class="badge badge-unavailable" th:unless="${ch.available}">Unavailable</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
