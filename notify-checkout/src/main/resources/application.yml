server:
  port: ${PORT:8090}

spring:
  application:
    name: notifyhub-checkout
  datasource:
    url: jdbc:h2:file:./data/licenses;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2

# Stripe configuration (set via environment variables)
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  pro-price-id: ${STRIPE_PRO_PRICE_ID:price_placeholder}
  success-url: ${SUCCESS_URL:https://gabrielbbaldez.github.io/notify-hub/?purchase=success}
  cancel-url: ${CANCEL_URL:https://gabrielbbaldez.github.io/notify-hub/}

# NotifyHub email for sending license keys (optional)
notify:
  channels:
    email:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:noreply@notifyhub.io}
      from-name: NotifyHub
      tls: true
