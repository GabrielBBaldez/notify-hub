## ========================================
## NotifyHub Demo — Real Services Profile
## ========================================
## Run with: mvn -pl notify-demo spring-boot:run -Dspring-boot.run.profiles=real
##
## Uses the same NOTIFY_CHANNELS_* env vars as the MCP image.
## Example:
##   NOTIFY_CHANNELS_EMAIL_HOST=smtp.gmail.com
##   NOTIFY_CHANNELS_EMAIL_PORT=587
##   NOTIFY_CHANNELS_EMAIL_USERNAME=you@gmail.com
##   NOTIFY_CHANNELS_EMAIL_PASSWORD=your-app-password
##   NOTIFY_CHANNELS_EMAIL_FROM=you@gmail.com

server:
  error:
    include-message: always
    include-exception: true

demo:
  embedded-smtp: false  # Disable GreenMail — we're using real SMTP
  slack:
    webhook-url: ${SLACK_WEBHOOK:}

notify:
  channels:
    email:
      host: ${NOTIFY_CHANNELS_EMAIL_HOST:smtp.gmail.com}
      port: ${NOTIFY_CHANNELS_EMAIL_PORT:587}
      username: ${NOTIFY_CHANNELS_EMAIL_USERNAME:}
      password: ${NOTIFY_CHANNELS_EMAIL_PASSWORD:}
      from: ${NOTIFY_CHANNELS_EMAIL_FROM:}
      from-name: NotifyHub
      tls: true
    # All other channels auto-configure via NOTIFY_CHANNELS_* env vars:
    #   NOTIFY_CHANNELS_DISCORD_WEBHOOK_URL, NOTIFY_CHANNELS_SLACK_WEBHOOK_URL,
    #   NOTIFY_CHANNELS_TELEGRAM_BOT_TOKEN, NOTIFY_CHANNELS_TELEGRAM_CHAT_ID,
    #   NOTIFY_CHANNELS_GOOGLE_CHAT_WEBHOOK_URL, NOTIFY_CHANNELS_TEAMS_WEBHOOK_URL,
    #   NOTIFY_CHANNELS_SMS_ACCOUNT_SID, NOTIFY_CHANNELS_SMS_AUTH_TOKEN, etc.
  retry:
    max-attempts: 3
    strategy: exponential
