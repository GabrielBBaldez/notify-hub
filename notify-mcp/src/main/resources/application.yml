spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false

# Logging is configured in logback-spring.xml (no console, file only)

# Enable delivery tracking by default
# Channel config comes from env vars via Spring Boot relaxed binding (same as Discord, Twitter, etc.)
# Do NOT add notify.channels.* entries with empty defaults here — ${ENV_VAR:} resolves to ""
# which tricks @ConditionalOnProperty into creating beans that crash on validation.
notify:
  tracking:
    enabled: true
  retry:
    max-attempts: 3
    strategy: exponential
  rate-limit:
    enabled: true
    use-defaults: true
