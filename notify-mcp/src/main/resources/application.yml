spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false

# Logging is configured in logback-spring.xml (no console, file only)

# Enable delivery tracking by default
notify:
  channels:
    telegram:
      bot-token: ${NOTIFY_CHANNELS_TELEGRAM_BOT_TOKEN:${NOTIFY_CHANNELS_TELEGRAM_BOTTOKEN:}}
      chat-id: ${NOTIFY_CHANNELS_TELEGRAM_CHAT_ID:${NOTIFY_CHANNELS_TELEGRAM_CHATID:}}
  tracking:
    enabled: true
  retry:
    max-attempts: 3
    strategy: exponential
  rate-limit:
    enabled: true
    use-defaults: true
